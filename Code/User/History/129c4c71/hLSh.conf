# Tải hình nền vào bộ nhớ (Preload)
preload = /path/to/image1.png
preload = /path/to/image2.jpg

# Gán hình nền cho từng màn hình
# Cú pháp: wallpaper = MÀN_HÌNH,/đường/dẫn/ảnh.png
wallpaper = eDP-1,/path/to/image1.png
wallpaper = HDMI-A-2,/path/to/image2.jpg

# Bật Splash text hiển thị câu quote nhỏ ở góc dưới màn hình (tuỳ chọn: true/false)
splash = false

# Bật IPC để gửi lệnh đổi hình nền nhanh từ terminal (tuỳ chọn: true/false)
ipc = on